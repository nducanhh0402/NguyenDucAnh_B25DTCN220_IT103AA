<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
        }

        .banner {
            width: 100%;
            height: 150px;
            background-color: #1eff29;
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .banner h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        .banner p {
            margin: 5px 0 0 0;
            font-size: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="banner">
        <h1>Nha Khoa Ánh Dương</h1>
        <p>Chăm sóc nụ cười Việt</p>
    </div>

</body>
</html>

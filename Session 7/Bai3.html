<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .dentist-card {
            width: 350px;
            border: 1px solid #000;
            font-family: Arial, sans-serif;
            margin: 20px auto;
        }

        .header-title {
            padding: 10px;
            color: #ff8c00;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dentist-img {
            width: 100%;
            display: block;
        }

        .info-container {
            padding: 15px;
        }

        .dentist-name {
            font-size: 20px;
            font-weight: bold;
            margin: 0;
        }

        .specialty {
            color: #1eff29;
            font-weight: bold;
            margin: 5px 0;
        }

        .description {
            font-size: 14px;
            line-height: 1.4;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="dentist-card">
        <div class="header-title">
            ⭐ NHA SĨ NỔI BẬT
        </div>
        
        <img src="https://via.placeholder.com/350x250" alt="BS Nguyễn Minh Tâm" class="dentist-img">

        <div class="info-container">
            <p class="dentist-name">BS. Nguyễn Minh Tâm</p>
            <p class="specialty">Nha khoa thẩm mỹ</p>
            <p class="description">
                Hơn 10 năm kinh nghiệm trong lĩnh vực nha khoa thẩm mỹ, chuyên tẩy trắng răng, dán sứ và phục hình nụ cười.
            </p>
        </div>
    </div>

</body>
</html>

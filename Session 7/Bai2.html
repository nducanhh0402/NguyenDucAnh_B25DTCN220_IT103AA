<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .service-card {
            width: 300px;
            border: 2px solid #1eff29;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .service-card h2 {
            margin: 0;
            font-size: 24px;
        }

        .service-card p {
            margin: 10px 0 0 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="service-card">
        <h2>Tẩy trắng răng</h2>
        <p>Công nghệ hiện đại – An toàn – Hiệu quả</p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .menu-container {
  display: flex;          
  flex-direction: row;     
  justify-content: center; 
  gap: 20px;              
  padding: 50px;
  background-color: #f5f5f5;
}

.menu-item {
  flex: 1;                
  max-width: 200px;        
  text-align: center;     
}

.menu-item img {
  width: 100%;            
  border-radius: 8px;     
  height: 150px;         
  object-fit: cover;       
}

.menu-item p {
  margin-top: 10px;
  font-family: sans-serif;
  font-weight: bold;
  font-size: 14px;
}
    </style>
</head>
<body>
    <div class="menu-container">
  <div class="menu-item">
    <img src="link_anh_1.jpg" alt="Vegetable Salad">
    <p>Vegetable Salad</p>
  </div>

  <div class="menu-item">
    <img src="link_anh_2.jpg" alt="Pasta">
    <p>Pasta With Tomato and Basil</p>
  </div>

  <div class="menu-item">
    <img src="link_anh_3.jpg" alt="Fruit Salad">
    <p>Fruit Salad</p>
  </div>

  <div class="menu-item">
    <img src="link_anh_4.jpg" alt="Egg Curry">
    <p>Indian Egg Curry</p>
  </div>
</div>
    
</body>
</html>
